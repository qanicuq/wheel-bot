name: Wheel bot paper run

on:
  # Timing comes from cron-job.org (workflow_dispatch) weekdays at 11:10 AM New York time, not GitHub's unreliable scheduler.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wheel-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run paper bot
        run: python paper_bot.py
      - name: Save state
        run: |
          git config user.name "wheel-bot"
          git config user.email "wheel-bot@users.noreply.github.com"
          git add state.json trades.csv STATUS.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Paper run $(date -u +%F)"
          git push

      - name: Phone alert if this run failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: wheel-bot: Wheel bot paper run FAILED" -H "Priority: high" -H "Tags: x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Tap to open the failed run on GitHub." \
            "https://ntfy.sh/${NTFY_TOPIC}" || true
