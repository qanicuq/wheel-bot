name: Options screener

# Manual only: Actions tab -> "Options screener" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "put = cash-secured puts, call = covered calls"
        type: choice
        options: [put, call]
        default: put
      max_price:
        description: "Max share price"
        default: "50"
      expiration:
        description: "Expiration YYYY-MM-DD (blank = about 35 days out)"
        default: ""
      max_delta:
        description: "Max delta (0.15 = about 15% chance of assignment)"
        default: "0.15"

permissions:
  contents: write

concurrency:
  group: wheel-paper   # never runs at the same time as the paper bot's commit
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run screener
        run: >
          python screener.py --kind "${{ inputs.kind }}" --max-price "${{ inputs.max_price }}"
          --expiration "${{ inputs.expiration }}" --max-delta "${{ inputs.max_delta }}"
      - name: Save results
        run: |
          git config user.name "wheel-bot"
          git config user.email "wheel-bot@users.noreply.github.com"
          git add SCREENER.md
          git diff --cached --quiet || git commit -m "Screener run $(date -u +%F)"
          git pull --rebase && git push

      - name: Phone alert if this run failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: wheel-bot: Options screener FAILED" -H "Priority: high" -H "Tags: x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Tap to open the failed run on GitHub." \
            "https://ntfy.sh/${NTFY_TOPIC}" || true
